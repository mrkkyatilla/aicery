services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: aicery
      POSTGRES_PASSWORD: aicery
      POSTGRES_DB: aicery
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicery -d aicery"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    ports:
      - "4223:4222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/aicery-workspaces || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # qdrant image has no wget/curl; bash is available
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://aicery:aicery@postgres:5432/aicery
      API_KEY: ${API_KEY:-dev}
      USE_MOCK_PROVIDER: ${USE_MOCK_PROVIDER:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      NATS_URL: nats://nats:4222
      NATS_ENABLED: "true"
      # Host repo mounted at /workspace so CLI paths resolve locally.
      WORKSPACE_ROOT: /workspace
      CHAOS_TOOL_FAIL_RATE: ${CHAOS_TOOL_FAIL_RATE:-0}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-100}
      RATE_LIMIT_BACKEND: redis
      PROVIDER_FAILOVER_ENABLED: ${PROVIDER_FAILOVER_ENABLED:-true}
      QDRANT_URL: http://qdrant:6333
      SEMANTIC_SEARCH_ENABLED: ${SEMANTIC_SEARCH_ENABLED:-true}
      BLOB_STORAGE_ENABLED: ${BLOB_STORAGE_ENABLED:-false}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: aicery-workspaces
      MINIO_SECURE: "false"
      DEFAULT_WORKSPACE_ID: ${DEFAULT_WORKSPACE_ID:-local}
      USAGE_WEBHOOK_URL: ${USAGE_WEBHOOK_URL:-http://gateway:8081/internal/usage}
      USAGE_WEBHOOK_SECRET: ${GATEWAY_INTERNAL_SECRET:-internal-dev}
      HITL_ENABLED: ${HITL_ENABLED:-true}
      LANGGRAPH_CHECKPOINT_BACKEND: ${LANGGRAPH_CHECKPOINT_BACKEND:-postgres}
      TRUST_GATEWAY_HEADERS: ${TRUST_GATEWAY_HEADERS:-false}
      RATE_LIMIT_AT_GATEWAY_ONLY: ${RATE_LIMIT_AT_GATEWAY_ONLY:-false}
      ROUTER_LLM_ENABLED: ${ROUTER_LLM_ENABLED:-false}
      ROUTER_LLM_PROVIDER: ${ROUTER_LLM_PROVIDER:-mock}
      PLUGIN_PATHS: ${PLUGIN_PATHS:-examples/stock-advisor}
    volumes:
      - ${AICERY_WORKSPACE_MOUNT:-..}:/workspace:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  gateway-db:
    image: postgres:16
    environment:
      POSTGRES_USER: aicery
      POSTGRES_PASSWORD: aicery
      POSTGRES_DB: aicery_gateway
    ports:
      - "5434:5432"
    volumes:
      - gateway_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicery -d aicery_gateway"]
      interval: 5s
      timeout: 5s
      retries: 5

  gateway-migrate:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://aicery:aicery@gateway-db:5432/aicery_gateway
    command: ["alembic", "upgrade", "head"]
    depends_on:
      gateway-db:
        condition: service_healthy

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    environment:
      GATEWAY_DATABASE_URL: postgresql+psycopg://aicery:aicery@gateway-db:5432/aicery_gateway
      AICERY_RUNTIME_URL: http://api:8000
      AICERY_SERVICE_API_KEY: ${API_KEY:-dev}
      ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:-admin-dev}
      INTERNAL_WEBHOOK_SECRET: ${GATEWAY_INTERNAL_SECRET:-internal-dev}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      JWT_ENABLED: ${GATEWAY_JWT_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RATE_LIMIT_ENABLED: ${GATEWAY_RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_PER_MINUTE: ${GATEWAY_RATE_LIMIT_PER_MINUTE:-100}
      RATE_LIMIT_BACKEND: ${GATEWAY_RATE_LIMIT_BACKEND:-redis}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8081:8081"
    depends_on:
      gateway-db:
        condition: service_healthy
      gateway-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  sandbox-runner:
    profiles: [sandbox]
    build:
      context: sandbox-runner
      dockerfile: Dockerfile
    ports:
      - "8091:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: ..
      dockerfile: runtime/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://aicery:aicery@postgres:5432/aicery
      API_KEY: ${API_KEY:-dev}
      USE_MOCK_PROVIDER: ${USE_MOCK_PROVIDER:-true}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      NATS_URL: nats://nats:4222
      NATS_ENABLED: "true"
      WORKSPACE_ROOT: /app
      CHAOS_TOOL_FAIL_RATE: ${CHAOS_TOOL_FAIL_RATE:-0}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  gateway_postgres_data:
  qdrant_data:
  minio_data:
