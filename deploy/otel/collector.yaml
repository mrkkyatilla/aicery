# Example OpenTelemetry Collector config for local dev.
# Receives OTLP HTTP on :4318 and logs spans (swap exporter for Tempo/Jaeger in prod).

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  debug:
    verbosity: basic
  # Example Tempo (uncomment and set endpoint):
  # otlp/tempo:
  #   endpoint: tempo:4317
  #   tls:
  #     insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
