[project]
name = "aicery-cli"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["typer>=0.12", "aicery-sdk", "pyyaml>=6.0"]

[project.scripts]
aicery = "aicery.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aicery"]
