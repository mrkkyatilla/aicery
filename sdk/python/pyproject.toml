[project]
name = "aicery-sdk"
version = "0.0.2"
description = "Python client for the Aicery AI agent runtime — runs, agents, and SSE streaming"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Ömer Atilla Akkaya", email = "mrkkyatilla@gmail.com" },
]
keywords = ["ai", "agents", "langgraph", "runtime", "llm", "orchestration", "trace"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/mrkkyatilla/aicery"
Documentation = "https://aicery.dev/docs"
Repository = "https://github.com/mrkkyatilla/aicery"
Issues = "https://github.com/mrkkyatilla/aicery/issues"
Changelog = "https://github.com/mrkkyatilla/aicery/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aicery_sdk"]
