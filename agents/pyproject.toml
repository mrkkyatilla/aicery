[project]
name = "aicery-agents"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "aicery-core",
    "aicery-runtime",
    "langgraph>=0.2.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]
